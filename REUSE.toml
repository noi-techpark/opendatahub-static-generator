version = 1
SPDX-PackageName = "opendatahub-static-generator"
SPDX-PackageSupplier = "NOI Techpark <digital@noi.bz.it>"
SPDX-PackageDownloadLocation = "https://github.com/noi-techpark/opendatahub-static-generator"

[[annotations]]
path = [
  "**/*.cs"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "(c) NOI Techpark <digital@noi.bz.it>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  ".gitignore",
  ".dockerignore",
  "*.sln",
  "docker-compose.yml",
  "opendatahub-static-api/docker-compose.yml",
  "opendatahub-static-api/docker-compose.local.yml",
  "opendatahub-static-api/Dockerfile",
  "opendatahub-static-api/opendatahub-static-api.csproj",
  "opendatahub-static-api/appsettings.json",
  "opendatahub-static-api/appsettings.Development.json",
  "opendatahub-static-api/Properties/launchSettings.json",
  "opendatahub-static-api/StaticApi.http",
  "opendatahub-static-generator-worker/docker-compose.yml",
  "opendatahub-static-generator-worker/docker-compose.local.yml",
  "opendatahub-static-generator-worker/Dockerfile",
  "opendatahub-static-generator-worker/opendatahub-static-generator-worker.csproj",
  "opendatahub-static-generator-worker/appsettings.json",
  "opendatahub-static-generator-worker/appsettings.Development.json",
  "opendatahub-static-generator-worker/appsettings.Production.json",
  "opendatahub-static-generator-worker/Properties/launchSettings.json",
  "opendatahub-static-generator-cli/opendatahub-static-generator-cli.csproj",
  "opendatahub-static-generator-cli/appsettings.json",
  "opendatahub-static-generator-cli/appsettings.Development.json",
  ".vscode/launch.json",
  ".vscode/tasks.json",
  "data/.gitkeep",
  "infrastructure/**",
  ".github/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "(c) NOI Techpark <digital@noi.bz.it>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
  "README.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "(c) NOI Techpark <digital@noi.bz.it>"
SPDX-License-Identifier = "CC-BY-4.0"
