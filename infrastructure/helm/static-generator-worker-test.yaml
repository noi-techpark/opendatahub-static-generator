# Test environment values for the static-generator-worker chart.
#
# image.repository / image.tag / image.pullPolicy are overwritten by the workflow.
# The sync rules come from appsettings.<DOTNET_ENVIRONMENT>.json baked into the image.

image:
  repository: ghcr.io/noi-techpark/opendatahub-static-generator/opendatahub-static-generator-worker
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: container-registry-r

replicaCount: 1

resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    memory: 256Mi

# Scaleway File Storage (ReadWriteMany) so the static-api pod can mount it from any node.
# 25 GB is its minimum size, and sizes must be whole GB (1e9 bytes), hence G, not Gi.
persistence:
  enabled: true
  claimName: static-generator-data
  storageClass: sfs-standard
  accessMode: ReadWriteMany
  size: 25G
  mountPath: /data

# Non-secret environment (mirrors infrastructure/docker-compose.worker.run.yml).
env:
  DOTNET_ENVIRONMENT: "Development"
  Sync__OutputPath: "/data"

envSecret: {}
