# Default values for static-generator-worker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Keep at 1: every replica runs all sync rules and writes the same files.
replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-static-generator/opendatahub-static-generator-worker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Data volume the worker writes the JSON files to. It is shared with the static-api
# release (mounted by claimName), so it needs a ReadWriteMany storage class (efs).
persistence:
  enabled: true
  claimName: static-generator-data
  storageClass: efs
  accessMode: ReadWriteMany
  size: 1Gi
  mountPath: /data

# A map of non-sensitive environment variables (key: value).
env: {}

# A map of sensitive environment variables. Rendered into a Secret and injected
# into the container via secretKeyRef. Populated at deploy time from CI secrets.
envSecret: {}

# A list of (name | secret | key) tuples mapping an env var to a key of an
# existing cluster Secret: env var "name" = secret.key
envSecretRef: []
